version: '3.8'

# ==============================================================================
# MEG-BAR Docker Compose Orchestration Specification
# Serves Interactive Visualizer (visualizer/index.html) and Defense Slides (presentations/defense_slides.html)
# ==============================================================================

services:
  megbar-reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: megbar:v1.0.0
    container_name: megbar_reproduction_suite
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/visualizer/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
